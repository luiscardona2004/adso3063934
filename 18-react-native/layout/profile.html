<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Cars App</title>
    <link href="https://fonts.googleapis.com/css2?family=Days+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="main_home">

        <header class="header">
            <img src="img/logo_cars.PNG" alt="Logo" class="logo-icon">
            <img src="img/cars_titulo.png" alt="Cars" class="logo-text">
            <a href="index.html" class="profile-link">
                <img src="img/menu.png" alt="Menu icon" class="menu-icon">
            </a>
        </header>

        <div class="home_content page_content">

            <!-- Avatar + nombre -->
            <section class="profile_hero">
                <div class="profile_avatar">
                    <!-- Cambia esta imagen por la foto del usuario -->
                    <img src="img/mcqueen.jpg" alt="Avatar">
                </div>
                <h1 class="profile_name">LUIS</h1>
                <p class="profile_tag">@luis_racer · Since 2024</p>

                <div class="profile_stats_row">
                    <div class="profile_stat">
                        <span class="stat_number">12</span>
                        <span class="stat_label">FAVORITES</span>
                    </div>
                    <div class="profile_stat_divider"></div>
                    <div class="profile_stat">
                        <span class="stat_number">3</span>
                        <span class="stat_label">TEAMS</span>
                    </div>
                    <div class="profile_stat_divider"></div>
                    <div class="profile_stat">
                        <span class="stat_number">95</span>
                        <span class="stat_label">POINTS</span>
                    </div>
                </div>
            </section>

            <!-- Favoritos rápidos -->
            <section class="home_section">
                <div class="section_top">
                    <h2>MY FAVORITES</h2>
                    <a href="#">VIEW ALL</a>
                </div>
                <div class="characters_grid">
                    <article class="character_card">
                        <img src="img/mcqueen.jpg" alt="">
                        <span>MC QUEEN</span>
                    </article>
                    <article class="character_card">
                        <img src="img/doc.jpg" alt="">
                        <span>DOC HUDSON</span>
                    </article>
                    <!-- PLACEHOLDER -->
                    <article class="character_card char_card_placeholder">
                        <span style="font-size:1.5rem; color:#f0a000;">+</span>
                        <span>ADD MORE</span>
                    </article>
                </div>
            </section>

            <!-- Opciones de cuenta -->
            <section class="home_section">
                <h2>ACCOUNT</h2>
                <div class="profile_menu">

                    <a href="#" class="profile_menu_item">
                        <span class="pmenu_icon">❤</span>
                        <span class="pmenu_label">MY FAVORITES</span>
                        <span class="pmenu_arrow">›</span>
                    </a>

                    <a href="#" class="profile_menu_item">
                        <span class="pmenu_icon">⚙</span>
                        <span class="pmenu_label">SETTINGS</span>
                        <span class="pmenu_arrow">›</span>
                    </a>

                    <a href="#" class="profile_menu_item">
                        <span class="pmenu_icon">🏆</span>
                        <span class="pmenu_label">ACHIEVEMENTS</span>
                        <span class="pmenu_arrow">›</span>
                    </a>

                    <a href="#" class="profile_menu_item">
                        <span class="pmenu_icon">🔔</span>
                        <span class="pmenu_label">NOTIFICATIONS</span>
                        <span class="pmenu_arrow">›</span>
                    </a>

                    <!-- Separador -->
                    <div class="pmenu_separator"></div>

                    <a href="index.html" class="profile_menu_item profile_menu_item--danger">
                        <span class="pmenu_icon">⏻</span>
                        <span class="pmenu_label">SIGN OUT</span>
                        <span class="pmenu_arrow">›</span>
                    </a>

                </div>
            </section>

        </div>

        <!-- NAV -->
        <nav class="bottom_nav">
            <a href="home.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256">

                </svg>

    </main>
