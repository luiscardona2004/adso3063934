<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Cars App</title>

    <link href="https://fonts.googleapis.com/css2?family=Days+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="main_recovery">

        <header class="header">
            <img src="img/logo_cars.PNG" alt="Logo" class="logo-icon">
            <img src="img/cars_titulo.png" alt="Cars" class="logo-text">
        </header>

        <section class="recovery_content">

            <h1 class="recovery_title">
                FORGOT <br> PASSWORD
            </h1>

            <div class="mail_box">
                <span class="mail_icon">✉</span>
            </div>

            <p class="recovery_text">
                Enter your email address <br>
                and we will send you a code <br>
                to reset your password
            </p>

            <form class="recovery_form" action="#" method="post">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email">

                <button type="submit">SEND CODE</button>
            </form>

            <a href="login.html" class="back_login_link">Back to login</a>

        </section>

    </main>

</body>
</html>
